[workspace]
name = "Event-LAB"
version = "1.1.0"
description = "Event-based localization methods benchmarking toolkit"
channels = ["conda-forge", "robostack-noetic"]
platforms = [
    { name = "linux-64-cuda12", platform = "linux-64", cuda = "12" },
    "osx-64",
    "osx-arm64",
    "win-64",
]

[tasks]
eventlab = {cmd = "pixi run python eventlab_run.py"}
getdata = {cmd = "pixi run python eventlab_data.py"}
batch = {cmd = "pixi run python generate_batch.py batch_config.yaml config.yaml run_batch.sh && pixi run bash run_batch.sh"}
demo = {cmd = "pixi run python eventlab_run.py eventvlad brisbane_event sunset2 sunrise"}
verify-metrics = {cmd = "pixi run python utils/verify_metrics.py"}

[environments]
e2vid = {features = ["e2vid"], no-default-feature = true}
spikevpr = {features = ["spikevpr"]}
megaevent = {features = ["megaevent"]}
eventgem = {features = ["eventgem"]}

[dependencies]
python = "*"
pyyaml = "*"
gdown = "*"
requests = "*"
faiss = "*"
"ruamel.yaml" = "*"
loguru = "*"
tqdm = "*"
openpyxl = "*"
scipy = "*"
numpy = "<2"
h5py = "*"
matplotlib = "*"
ros-noetic-rosbag = "*"
ros-noetic-cv-bridge = "*"
pynmea2 = "*"
pandas = "*"
numba = "*"
tonic = "*"
prettytable = "*"
imageio = "*"
sinabs = "*"
scikit-image = "*"
wandb = "*"
pyarrow = "*"
fastparquet = "*"
torchvision = "*"
huggingface_hub = ">=1.5.0,<2"
sphinx = ">=8.2.3,<9"
sphinx-rtd-theme = ">=3.1.0,<4"
myst-parser = ">=5.1.0,<6"
opencv = ">=4.13.0,<5"
safetensors = "*" 
eventcv = ">=1.0.8"

[target.linux-64.dependencies]
cuda-version = "12.*"
mkl = "<2026"
pytorch-gpu = "*"
cuda-cudart-dev = "*"
cuda-crt = "*"
cudnn = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
cusparselt = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
safetensors = "*"

[pypi-options]
no-build-isolation = ["eventcv"]

[target.linux-64.pypi-dependencies]
samna = "*"

[target.osx-arm64.pypi-dependencies]
samna = "*"

[target.osx-64.pypi-dependencies]
samna = "*"

[target.osx-64.dependencies]
numpy = "<2"

[feature.e2vid]
channels = ["conda-forge"]
platforms = ["linux-64-cuda12"]

[feature.e2vid.dependencies]
python = "<=3.11"
numpy = ">=1.6.0,<1.20"
pandas = "*"
opencv = "*"
scipy = "*"
pyyaml = "*"
h5py = "*"
requests = "*"
tqdm = "*"
matplotlib = "*"
pillow = "*"
cuda-version = "12.*"
pytorch-gpu = "*"
cuda-cudart-dev = "*"
cuda-crt = "*"
cudnn = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
cusparselt = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"

# --- Baseline-specific environments -------------------------------------------
# Each new baseline layers its extra dependencies on top of the default feature,
# so torch/numpy/eventcv are shared and only the deltas are solved per baseline.

[feature.spikevpr.pypi-dependencies]
# SpikeVPR pins spikingjelly==0.0.0.0.15 upstream, which was never published to
# PyPI or conda-forge (0.0.0.0.14 is the newest). It only uses
# spikingjelly.activation_based.{neuron,functional,layer}, unchanged in .14.
#
# Deliberately a PyPI dep, not conda: conda-forge's spikingjelly hard-requires
# cupy, which has no osx-* build, so that route can never solve on macOS. The
# PyPI wheel is py3-none-any and its torch/torchvision/numpy/scipy requirements
# are already satisfied by the conda packages in the default feature.
spikingjelly = "==0.0.0.0.14"

[feature.megaevent.dependencies]
safetensors = "*"

[feature.eventgem.dependencies]
kornia = "*"
hdf5plugin = "*"
scikit-learn = "*"

# General configuration for Event-Lab

data_path: "/media/adam/vprdatasets/eventgem" # Path to the datasets directory

# Processing options
request_input: false # Request input from the user for dataset download
gps_tolerance: 25.0 # Ground truth tolerance in metres along the reference route
filter_places_sec: 0 # Minimum separation in seconds for image-folder adapters

# EventCV streams recordings on demand; no persistent frame cache is built.
timewindows: [50] # Window durations in milliseconds
representation: "polarity" # EventCV representation; reconstruction is unavailable for now
# Parameter documentation: https://docs.eventcv.net/en/latest/api.html#eventcv.EventReader.with_repr
representation_options: {} # EventCV reader.with_repr() parameters; {} uses defaults
hot_pixel_filter: true
reconstruction: {} # Disabled until EventCV supports named reconstruction methods

# Available baselines
VPR-Baselines:
- "lens"
- "sparse_event"
- "ensemble"
- "eventvlad"
- "vprmethods"
- "spikevpr"
- "megaevent"
- "eventgem"

# Dataset recordings to download for Event-LAB
datasets:
- name: "brisbane_event"
  sequences:
  - "sunset2"
  - "sunrise"

- name: "nsavp"
  sequences:
  - "R0_FA0"
  - "R0_FS0"

- name: "gardens_point_event"
  sequences:
  - "left"
  - "right"
